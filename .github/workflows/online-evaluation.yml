name: online-rag-evaluation

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  online-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STAGING_QUERY_URL: ${{ secrets.STAGING_QUERY_URL }}
      KB_EVAL_API_KEY: ${{ secrets.STAGING_EVAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Require staging evaluation secrets
        shell: bash
        run: |
          test -n "$STAGING_QUERY_URL" || { echo "STAGING_QUERY_URL is not configured"; exit 2; }
          test -n "$KB_EVAL_API_KEY" || { echo "STAGING_EVAL_API_KEY is not configured"; exit 2; }
      - name: Run release evaluation gates
        run: >-
          uv run python -m app.evaluation.run_eval
          --base-url "$STAGING_QUERY_URL"
          --dataset evaluation/rag_cases.phase1.jsonl
          --require-online
          --gate-profile release
          --output evaluation/reports/online-release.json
      - name: Upload online report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-rag-evaluation
          path: evaluation/reports/online-release.json
