name: quality-gates

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Secret scan (redacted output)
        run: python scripts/scan_secrets.py --history
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Compile
        run: uv run python -m compileall -q app tests
      - name: Ruff
        run: uv run ruff check app tests
      - name: Mypy
        run: uv run mypy app scripts tests
      - name: Validate approved evaluation labels
        run: >-
          uv run python -m app.evaluation.run_eval
          --dataset evaluation/rag_cases.phase1.jsonl
          --validate-only
      - name: Unit tests
        env:
          APP_ENV: test
          LOG_FILE_ENABLE: "False"
          LANGGRAPH_CHECKPOINTER: memory
          DATABASE_URL: "sqlite:///:memory:"
        run: uv run pytest tests/unit -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: API tests
        env:
          APP_ENV: test
          LOG_FILE_ENABLE: "False"
          LANGGRAPH_CHECKPOINTER: memory
          DATABASE_URL: "sqlite:///:memory:"
        run: uv run pytest tests/api -q
      - name: Security isolation tests
        env:
          APP_ENV: test
          LOG_FILE_ENABLE: "False"
          LANGGRAPH_CHECKPOINTER: memory
          DATABASE_URL: "sqlite:///:memory:"
        run: >-
          uv run pytest -q
          tests/unit/test_oidc_security.py
          tests/unit/test_tenant_acl.py
          tests/unit/test_milvus_tenant_isolation.py
          tests/unit/test_document_lifecycle.py
          tests/api/test_query_acl.py
      - name: Evaluation metric tests
        run: uv run pytest tests/evaluation -q
      - name: Approved offline evaluation gate
        run: >-
          uv run python -m app.evaluation.run_eval
          --dataset evaluation/rag_cases.phase1.jsonl
          --responses evaluation/offline_responses.phase1.jsonl
          --gate-profile pr
          --output evaluation/reports/ci-offline.json
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-reports
          path: |
            coverage.xml
            evaluation/reports/ci-offline.json
            evaluation/reports/ci-offline.md

  postgres-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-owner-password
          POSTGRES_DB: knowledge_base_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_base_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      LOG_FILE_ENABLE: "False"
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-owner-password@127.0.0.1:5432/knowledge_base_ci
      POSTGRES_OWNER_URL: postgresql://postgres:ci-only-owner-password@127.0.0.1:5432/knowledge_base_ci
      POSTGRES_RUNTIME_PASSWORD: ci-only-runtime-password-value
      TEST_POSTGRES_OWNER_URL: postgresql+psycopg://postgres:ci-only-owner-password@127.0.0.1:5432/knowledge_base_ci
      TEST_POSTGRES_RUNTIME_URL: postgresql+psycopg://knowledge_app:ci-only-runtime-password-value@127.0.0.1:5432/knowledge_base_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Upgrade PostgreSQL schema
        run: uv run alembic upgrade head
      - name: Prepare least-privileged runtime role
        run: uv run python scripts/prepare_postgres_runtime_role.py
      - name: Run real PostgreSQL RLS acceptance
        run: uv run pytest tests/integration/test_postgres_rls.py -q

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Export locked runtime dependency set
        run: uv export --frozen --no-dev --no-hashes --output-file security-requirements.txt
      - name: Audit Python dependencies
        run: >-
          uvx --from pip-audit==2.9.0 pip-audit
          --requirement security-requirements.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
          --progress-spinner off
          --format json
          --output dependency-audit.json
      - name: Build non-root image with provenance labels
        run: |
          docker build \
            --build-arg APP_VERSION="0.1.0-ci" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag enterprise-rag-ci:"$GITHUB_SHA" .
          test "$(docker image inspect enterprise-rag-ci:"$GITHUB_SHA" --format '{{.Config.User}}')" = "10001:10001"
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p security-artifacts
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/security-artifacts:/out" \
            anchore/syft:v1.33.0 \
            enterprise-rag-ci:"$GITHUB_SHA" -o cyclonedx-json=/out/sbom.cdx.json
      - name: Scan image vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/security-artifacts:/out" \
            aquasec/trivy:0.67.2 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format json \
            --output /out/trivy-image.json \
            enterprise-rag-ci:"$GITHUB_SHA"
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-evidence
          path: |
            dependency-audit.json
            security-requirements.txt
            security-artifacts/sbom.cdx.json
            security-artifacts/trivy-image.json
