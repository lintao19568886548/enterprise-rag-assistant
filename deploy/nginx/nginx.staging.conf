events {
  worker_connections 1024;
}

http {
  server_tokens off;
  client_max_body_size 50m;
  proxy_connect_timeout 10s;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/staging.crt;
    ssl_certificate_key /etc/nginx/certs/staging.key;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    location = /metrics {
      return 404;
    }

    location / {
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_pass http://query-api:8001;
      proxy_buffering off;
    }
  }

  server {
    listen 444 ssl;
    ssl_certificate /etc/nginx/certs/staging.crt;
    ssl_certificate_key /etc/nginx/certs/staging.key;

    location = /metrics {
      return 404;
    }

    location / {
      limit_req zone=api_per_ip burst=20 nodelay;
      proxy_pass http://import-api:8000;
      proxy_request_buffering off;
    }
  }

  server {
    listen 9443 ssl;
    ssl_certificate /etc/nginx/certs/staging.crt;
    ssl_certificate_key /etc/nginx/certs/staging.key;

    location / {
      proxy_pass http://minio:9000;
      proxy_request_buffering off;
    }
  }
}
