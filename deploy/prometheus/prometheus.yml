global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: enterprise-rag-import
    metrics_path: /metrics
    static_configs:
      - targets: ["import-api:8000"]
  - job_name: enterprise-rag-query
    metrics_path: /metrics
    static_configs:
      - targets: ["query-api:8001"]
