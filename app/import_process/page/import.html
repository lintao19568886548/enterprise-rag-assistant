<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业知识库管理与文件导入</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        /* 赛博朋克背景和基础样式 */
        body {
            background: #0a0a1a;
            background-image:
                linear-gradient(rgba(10, 10, 26, 0.8) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 10, 26, 0.8) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #00ffcc;
            min-height: 100vh;
            padding: 20px;
        }

        /* 容器样式 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(0, 0, 20, 0.85);
            border: 1px solid #ff00ff;
            padding: 30px;
            border-radius: 8px;
            box-shadow:
                0 0 15px rgba(0, 255, 204, 0.5),
                inset 0 0 10px rgba(255, 0, 255, 0.3);
        }

        /* 标题样式 */
        h1 {
            text-align: center;
            color: #ff00ff;
            text-shadow:
                0 0 5px #ff00ff,
                0 0 10px #ff00ff,
                0 0 20px #00ffcc;
            font-size: 2.5rem;
            margin-bottom: 30px;
            letter-spacing: 3px;
        }
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .toolbar label { color: #00ffff; font-size: .9rem; }
        .toolbar select, .toolbar input {
            background: #05051a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            border-radius: 5px;
            padding: 8px 10px;
        }
        .task-action {
            background: transparent;
            color: #ff8ea8;
            border: 1px solid #ff4068;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
        }
        .task-action.retry { color: #00ffcc; border-color: #00ffcc; }
        .task-action[hidden] { display: none; }
        .manager {
            margin-bottom: 24px;
            padding: 18px;
            border: 1px solid #00a9a0;
            border-radius: 8px;
            background: rgba(0, 25, 40, .72);
        }
        .manager h2 { color: #00ffff; margin-bottom: 12px; font-size: 1.15rem; }
        .manager-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .manager-actions input {
            flex: 1 1 220px;
            min-width: 0;
            background: #05051a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            border-radius: 5px;
            padding: 8px 10px;
        }
        .manager-button {
            background: rgba(0,255,204,.08);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            border-radius: 5px;
            padding: 8px 12px;
            cursor: pointer;
        }
        .manager-button.danger { color: #ff8ea8; border-color: #ff4068; }
        .manager-status { min-height: 20px; color: #a8d8d2; font-size: .85rem; margin-bottom: 10px; }
        .document-list { display: grid; gap: 8px; }
        .document-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border: 1px solid rgba(0,255,204,.25);
            border-radius: 6px;
        }
        .document-name { color: #ffff8a; overflow-wrap: anywhere; }
        .document-meta { color: #89b6bf; font-size: .78rem; margin-top: 4px; }
        .empty-state { color: #89b6bf; padding: 10px 0; }

        /* 上传区域样式 */
        .upload-area {
            border: 2px dashed #00ffcc;
            padding: 60px 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .upload-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent,
                rgba(0, 255, 204, 0.2),
                transparent);
            transition: left 0.8s ease;
        }

        .upload-area:hover::before {
            left: 100%;
        }

        .upload-area:hover {
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.4);
        }

        .upload-area h2 {
            color: #00ffcc;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .upload-area p {
            color: #ffff00;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .upload-area input {
            display: none;
        }

        /* 文件列表样式 */
        #fileList {
            gap: 15px;
            display: flex;
            flex-direction: column;
        }

        /* 单个文件项样式 */
        .file-item {
            background: rgba(0, 0, 40, 0.9);
            border: 1px solid #00ffcc;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            transition: all 0.3s ease;
        }

        .file-item:hover {
            border-color: #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
        }

        /* 文件信息头部 */
        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .file-name {
            color: #ffff00;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 5px #ffff00;
        }

        .file-size {
            color: #00ffff;
            font-size: 0.9rem;
        }

        /* 状态徽章 */
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
        }

        .status-uploading {
            background: rgba(0, 255, 204, 0.2);
            border: 1px solid #00ffcc;
            color: #00ffcc;
        }

        .status-processing {
            background: rgba(255, 255, 0, 0.2);
            border: 1px solid #ffff00;
            color: #ffff00;
        }

        .status-completed {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
        }

        .status-failed {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
        }

        /* 进度条样式 */
        .progress-container {
            width: 100%;
            height: 20px;
            background: rgba(0, 0, 30, 0.8);
            border: 1px solid #ff00ff;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #ff00ff);
            border-radius: 8px;
            width: 0%;
            transition: width 0.3s ease;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            animation: progressGlow 1.5s infinite;
        }

        @keyframes progressGlow {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* 日志区域样式 */
        .logs-toggle {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }

        .logs-toggle:hover {
            background: rgba(0, 255, 204, 0.2);
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .logs-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
            background: rgba(0, 0, 20, 0.8);
            border: 1px solid #003366;
            border-radius: 4px;
            padding: 0 10px;
        }

        .logs-container.open {
            max-height: 300px;
            padding: 10px;
        }

        .log-item {
            color: #cccccc;
            font-size: 0.85rem;
            padding: 5px 0;
            border-bottom: 1px dashed rgba(0, 255, 204, 0.2);
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-done {
            color: #00ff00;
        }

        .log-running {
            color: #ffff00;
        }

        /* 响应式样式 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .upload-area {
                padding: 40px 15px;
            }

            .file-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .document-row { grid-template-columns: 1fr 1fr; }
            .document-row > div:first-child { grid-column: 1 / -1; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📡 企业知识库管理与导入</h1>
        <div class="toolbar">
            <label>知识库
                <select id="kbSelect">
                    <option value="00000000-0000-0000-0000-000000000010">默认知识库</option>
                </select>
            </label>
            <label>生产环境 API Key
                <input id="apiKey" type="password" autocomplete="off" placeholder="开发模式可留空">
            </label>
        </div>

        <section class="manager" aria-labelledby="managerTitle">
            <h2 id="managerTitle">知识库与文档</h2>
            <div class="manager-actions">
                <input id="newKbName" maxlength="255" placeholder="新知识库名称" aria-label="新知识库名称">
                <button class="manager-button" id="createKb" type="button">创建知识库</button>
                <button class="manager-button" id="refreshDocuments" type="button">刷新文档</button>
                <button class="manager-button danger" id="deleteKb" type="button">删除当前知识库</button>
            </div>
            <div class="manager-status" id="managerStatus" role="status" aria-live="polite"></div>
            <div class="document-list" id="documentList"></div>
        </section>

        <!-- 上传区域 -->
        <div class="upload-area" id="uploadArea">
            <h2>📤 拖拽文件至此处 或 点击选择文件</h2>
            <p>支持格式: PDF (.pdf) / Markdown (.md)</p>
            <p>可同时上传多个文件</p>
            <input type="file" id="fileInput" multiple accept=".pdf,.md">
        </div>

        <!-- 文件列表 -->
        <div id="fileList"></div>
    </div>

    <script>
        // API基础地址（可根据实际情况修改）
        const API_BASE = location.protocol.startsWith('http')
            ? `${location.protocol}//${location.host}`
            : 'http://127.0.0.1:8000';

        // DOM元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const kbSelect = document.getElementById('kbSelect');
        const apiKeyEl = document.getElementById('apiKey');
        const newKbNameEl = document.getElementById('newKbName');
        const createKbBtn = document.getElementById('createKb');
        const deleteKbBtn = document.getElementById('deleteKb');
        const refreshDocumentsBtn = document.getElementById('refreshDocuments');
        const documentListEl = document.getElementById('documentList');
        const managerStatusEl = document.getElementById('managerStatus');
        apiKeyEl.value = sessionStorage.getItem('kb_import_api_key') || '';
        const DEFAULT_KB_ID = '00000000-0000-0000-0000-000000000010';

        function authHeaders() {
            const key = (apiKeyEl.value || '').trim();
            return key ? {'X-API-Key': key} : {};
        }

        async function loadKnowledgeBases() {
            try {
                const selected = kbSelect.value || localStorage.getItem('kb_import_knowledge_base_id') || DEFAULT_KB_ID;
                const response = await fetch(`${API_BASE}/knowledge-bases`, {headers: authHeaders()});
                if (!response.ok) throw new Error(`知识库加载失败: ${response.status}`);
                const data = await response.json();
                kbSelect.textContent = '';
                for (const kb of (data.items || [])) {
                    const option = document.createElement('option');
                    option.value = kb.id;
                    option.textContent = kb.name || kb.id;
                    kbSelect.appendChild(option);
                }
                if ((data.items || []).some(item => item.id === selected)) kbSelect.value = selected;
                if (kbSelect.value) localStorage.setItem('kb_import_knowledge_base_id', kbSelect.value);
                await loadDocuments();
            } catch (error) {
                managerStatusEl.textContent = error.message || '知识库加载失败';
            }
        }

        function setManagerStatus(message, isError = false) {
            managerStatusEl.textContent = message || '';
            managerStatusEl.style.color = isError ? '#ff8ea8' : '#a8d8d2';
        }

        async function loadDocuments() {
            const knowledgeBaseId = kbSelect.value;
            documentListEl.textContent = '';
            if (!knowledgeBaseId) return;
            setManagerStatus('正在加载文档…');
            try {
                const response = await fetch(
                    `${API_BASE}/knowledge-bases/${encodeURIComponent(knowledgeBaseId)}/documents`,
                    {headers: authHeaders()},
                );
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || `文档加载失败: ${response.status}`);
                const items = Array.isArray(data.items) ? data.items : [];
                if (!items.length) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    empty.textContent = '当前知识库还没有文档，请在下方上传。';
                    documentListEl.appendChild(empty);
                }
                for (const item of items) renderDocument(item);
                setManagerStatus(`共 ${items.length} 份有效文档`);
            } catch (error) {
                setManagerStatus(error.message || '文档加载失败', true);
            }
        }

        function renderDocument(item) {
            const row = document.createElement('div');
            row.className = 'document-row';
            const info = document.createElement('div');
            const name = document.createElement('div');
            name.className = 'document-name';
            name.textContent = item.original_filename || item.id;
            const meta = document.createElement('div');
            meta.className = 'document-meta';
            meta.textContent = `状态 ${item.status || 'unknown'} · 版本 ${item.current_version || 1} · ${(Number(item.file_size || 0) / 1024).toFixed(1)} KB`;
            info.append(name, meta);
            const rebuild = document.createElement('button');
            rebuild.className = 'manager-button';
            rebuild.type = 'button';
            rebuild.textContent = '重新索引';
            rebuild.addEventListener('click', () => rebuildDocument(item.id));
            const remove = document.createElement('button');
            remove.className = 'manager-button danger';
            remove.type = 'button';
            remove.textContent = '删除';
            remove.addEventListener('click', () => deleteDocument(item.id, item.original_filename));
            row.append(info, rebuild, remove);
            documentListEl.appendChild(row);
        }

        async function createKnowledgeBase() {
            const name = (newKbNameEl.value || '').trim();
            if (!name) return setManagerStatus('请输入知识库名称', true);
            try {
                const response = await fetch(`${API_BASE}/knowledge-bases`, {
                    method: 'POST',
                    headers: {...authHeaders(), 'Content-Type': 'application/json'},
                    body: JSON.stringify({name, description: '', permission_scope: 'private'}),
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || `创建失败: ${response.status}`);
                newKbNameEl.value = '';
                await loadKnowledgeBases();
                kbSelect.value = data.id;
                localStorage.setItem('kb_import_knowledge_base_id', data.id);
                await loadDocuments();
                setManagerStatus(`知识库“${data.name}”已创建`);
            } catch (error) {
                setManagerStatus(error.message || '创建知识库失败', true);
            }
        }

        async function deleteKnowledgeBase() {
            const id = kbSelect.value;
            const name = kbSelect.options[kbSelect.selectedIndex]?.textContent || id;
            if (!id || id === DEFAULT_KB_ID) return setManagerStatus('默认知识库受保护，不能删除', true);
            if (!confirm(`确认删除知识库“${name}”及其文档索引吗？`)) return;
            try {
                const response = await fetch(`${API_BASE}/knowledge-bases/${encodeURIComponent(id)}?confirm=true`, {
                    method: 'DELETE', headers: authHeaders(),
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || `删除失败: ${response.status}`);
                localStorage.removeItem('kb_import_knowledge_base_id');
                await loadKnowledgeBases();
                setManagerStatus('知识库已删除，历史任务默认隐藏');
            } catch (error) {
                setManagerStatus(error.message || '删除知识库失败', true);
            }
        }

        async function rebuildDocument(documentId) {
            try {
                const response = await fetch(`${API_BASE}/documents/${encodeURIComponent(documentId)}/rebuild`, {
                    method: 'POST', headers: authHeaders(),
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || `重建失败: ${response.status}`);
                setManagerStatus(`重新索引任务已创建：${data.task_id}`);
                await loadDocuments();
            } catch (error) {
                setManagerStatus(error.message || '重新索引失败', true);
            }
        }

        async function deleteDocument(documentId, filename) {
            if (!confirm(`确认删除文档“${filename || documentId}”及其向量吗？`)) return;
            try {
                const response = await fetch(`${API_BASE}/documents/${encodeURIComponent(documentId)}?confirm=true`, {
                    method: 'DELETE', headers: authHeaders(),
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || `删除失败: ${response.status}`);
                setManagerStatus('文档已删除');
                await loadDocuments();
            } catch (error) {
                setManagerStatus(error.message || '删除文档失败', true);
            }
        }

        // 初始化
        function init() {
            loadKnowledgeBases();
            apiKeyEl.addEventListener('change', () => {
                sessionStorage.setItem('kb_import_api_key', (apiKeyEl.value || '').trim());
                loadKnowledgeBases();
            });
            kbSelect.addEventListener('change', () => {
                localStorage.setItem('kb_import_knowledge_base_id', kbSelect.value);
                loadDocuments();
            });
            createKbBtn.addEventListener('click', createKnowledgeBase);
            deleteKbBtn.addEventListener('click', deleteKnowledgeBase);
            refreshDocumentsBtn.addEventListener('click', loadDocuments);
            // 点击上传区域触发文件选择
            uploadArea.addEventListener('click', () => fileInput.click());

            // 文件选择事件
            fileInput.addEventListener('change', handleFileSelect);

            // 拖拽事件处理
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#ff00ff';
                uploadArea.style.boxShadow = '0 0 25px rgba(255, 0, 255, 0.5)';
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = '#00ffcc';
                uploadArea.style.boxShadow = '0 0 20px rgba(255, 0, 255, 0.4)';
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#00ffcc';
                uploadArea.style.boxShadow = '0 0 20px rgba(255, 0, 255, 0.4)';

                if (e.dataTransfer.files.length > 0) {
                    handleFiles(e.dataTransfer.files);
                }
            });
        }

        // 处理文件选择
        function handleFileSelect(e) {
            if (e.target.files.length > 0) {
                handleFiles(e.target.files);
            }
        }

        // 处理文件（验证+创建文件项）
        function handleFiles(files) {
            Array.from(files).forEach(file => {
                // 验证文件格式
                if (!['application/pdf', 'text/markdown', '.pdf', '.md'].some(type =>
                    file.type === type || file.name.endsWith(type)
                )) {
                    alert(`文件 ${file.name} 格式不支持！仅支持 PDF 和 Markdown 文件`);
                    return;
                }

                // 创建文件项
                createFileItem(file);
            });
        }

        // 创建文件项DOM
        function createFileItem(file) {
            // 创建文件项容器
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.dataset.fileId = Date.now() + '-' + Math.random().toString(36).substr(2, 9);

            // 文件大小格式化（KB，保留2位小数）
            const fileSize = (file.size / 1024).toFixed(2) + ' KB';

            // 全部使用 DOM API，避免把文件名等不可信内容交给 HTML 解析器。
            const header = document.createElement('div');
            header.className = 'file-header';
            const fileNameEl = document.createElement('div');
            fileNameEl.className = 'file-name';
            fileNameEl.textContent = file.name;
            const fileSizeEl = document.createElement('div');
            fileSizeEl.className = 'file-size';
            fileSizeEl.textContent = `大小: ${fileSize}`;
            const status = document.createElement('div');
            status.className = 'status-badge status-uploading';
            status.textContent = '上传中...';
            header.append(fileNameEl, fileSizeEl, status);
            const progressContainer = document.createElement('div');
            progressContainer.className = 'progress-container';
            const progress = document.createElement('div');
            progress.className = 'progress-bar';
            progress.style.width = '0%';
            progressContainer.appendChild(progress);
            const logsButton = document.createElement('button');
            logsButton.className = 'logs-toggle';
            logsButton.type = 'button';
            logsButton.textContent = '📜 查看系统日志';
            const cancelButton = document.createElement('button');
            cancelButton.className = 'task-action cancel';
            cancelButton.type = 'button';
            cancelButton.hidden = true;
            cancelButton.textContent = '取消任务';
            const retryButton = document.createElement('button');
            retryButton.className = 'task-action retry';
            retryButton.type = 'button';
            retryButton.hidden = true;
            retryButton.textContent = '重试任务';
            const logs = document.createElement('div');
            logs.className = 'logs-container';
            fileItem.append(header, progressContainer, logsButton, cancelButton, retryButton, logs);

            // 添加到文件列表
            fileList.appendChild(fileItem);

            // 日志切换功能
            const logsToggle = fileItem.querySelector('.logs-toggle');
            const logsContainer = fileItem.querySelector('.logs-container');
            logsToggle.addEventListener('click', () => {
                logsContainer.classList.toggle('open');
                logsToggle.textContent = logsContainer.classList.contains('open')
                    ? '📜 收起系统日志'
                    : '📜 查看系统日志';
            });
            fileItem.querySelector('.cancel').addEventListener('click', () => taskAction(fileItem, 'cancel'));
            fileItem.querySelector('.retry').addEventListener('click', () => taskAction(fileItem, 'retry'));

            // 开始上传文件
            uploadFile(file, fileItem);
        }

        // 上传文件到服务器
        async function uploadFile(file, fileItem) {
            const progressBar = fileItem.querySelector('.progress-bar');
            const statusBadge = fileItem.querySelector('.status-badge');
            const logsContainer = fileItem.querySelector('.logs-container');

            try {
                // 创建FormData
                const formData = new FormData();
                formData.append('files', file);
                formData.append('knowledge_base_id', kbSelect.value);

                // 上传文件
                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: formData,
                    headers: authHeaders(),
                    // 进度监控
                    signal: AbortSignal.timeout(30000), // 30秒超时
                });

                if (!response.ok) {
                    let detail = `${response.status} ${response.statusText}`;
                    try {
                        const errorBody = await response.json();
                        detail = `${errorBody.code || response.status}: ${errorBody.message || detail}`;
                    } catch (_) {}
                    throw new Error(detail);
                }

                const result = await response.json();
                const taskId = result.task_ids?.[0];

                if (!taskId && result.files?.[0]?.duplicate) {
                    statusBadge.className = 'status-badge status-completed';
                    statusBadge.textContent = '✅ 内容已存在（未重复导入）';
                    progressBar.style.width = '100%';
                    addLog(logsContainer, `内容哈希已存在，文档ID: ${result.files[0].document_id}`, 'done');
                    return;
                }
                if (!taskId) {
                    throw new Error('服务端未返回任务 ID');
                }
                fileItem.dataset.taskId = taskId;
                fileItem.querySelector('.cancel').hidden = false;

                // 更新状态：上传完成，开始处理
                statusBadge.className = 'status-badge status-processing';
                statusBadge.textContent = '任务进行中...';
                progressBar.style.width = '30%';

                // 添加上传成功日志
                addLog(logsContainer, `✅ 文件上传成功，任务ID: ${taskId}`, 'done');

                // 开始轮询任务状态
                pollTaskStatus(taskId, fileItem);

            } catch (error) {
                // 上传失败处理
                statusBadge.className = 'status-badge status-failed';
                statusBadge.textContent = '❌ 任务失败 ❌';
                progressBar.style.width = '100%';
                progressBar.style.background = 'linear-gradient(90deg, #ff0000, #cc0000)';

                // 添加错误日志
                addLog(logsContainer, `❌ 上传失败: ${error.message}`, 'running');
                console.error('上传错误:', error);
            }
        }

        async function taskAction(fileItem, action) {
            const taskId = fileItem.dataset.taskId;
            if (!taskId) return;
            const logs = fileItem.querySelector('.logs-container');
            try {
                const response = await fetch(`${API_BASE}/tasks/${taskId}/${action}`, {
                    method: 'POST',
                    headers: authHeaders(),
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || `${action} 失败`);
                addLog(logs, action === 'cancel' ? '已发送取消请求' : '已重新提交失败任务', 'done');
                fileItem.querySelector('.retry').hidden = true;
                fileItem.querySelector('.cancel').hidden = action !== 'retry';
                if (action === 'retry') pollTaskStatus(taskId, fileItem);
            } catch (error) {
                addLog(logs, `操作失败: ${error.message}`, 'running');
            }
        }

        // 轮询任务状态
        async function pollTaskStatus(taskId, fileItem) {
            const progressBar = fileItem.querySelector('.progress-bar');
            const statusBadge = fileItem.querySelector('.status-badge');
            const logsContainer = fileItem.querySelector('.logs-container');

            // 轮询函数
            const checkStatus = async () => {
                try {
                    const response = await fetch(`${API_BASE}/status/${taskId}`, {headers: authHeaders()});

                    if (!response.ok) {
                        throw new Error(`获取状态失败: ${response.status}`);
                    }

                    const result = await response.json();
                    const { status, done_list = [], running_list = [] } = result;
                    if (typeof result.progress === 'number') {
                        progressBar.style.width = `${Math.max(0, Math.min(100, result.progress))}%`;
                    }

                    // 处理完成日志
                    done_list.forEach(logText => {
                        const normalizedLog = normalizeDoneLog(logText);
                        addLog(logsContainer, normalizedLog, 'done');
                    });

                    // 处理进行中日志
                    running_list.forEach(logText => {
                        const normalizedLog = normalizeRunningLog(logText);
                        addLog(logsContainer, normalizedLog, 'running');
                    });

                    // 更新状态和进度
                    switch (status) {
                        case 'processing':
                            fileItem.querySelector('.cancel').hidden = false;
                            break;

                        case 'completed':
                            statusBadge.className = 'status-badge status-completed';
                            statusBadge.textContent = '✅ 任务完成 ✅';
                            progressBar.style.width = '100%';
                            fileItem.querySelector('.cancel').hidden = true;
                            addLog(logsContainer, '🎉 所有任务处理完成！', 'done');
                            loadDocuments();
                            return; // 停止轮询

                        case 'failed':
                            statusBadge.className = 'status-badge status-failed';
                            statusBadge.textContent = '❌ 任务失败 ❌';
                            progressBar.style.width = '100%';
                            progressBar.style.background = 'linear-gradient(90deg, #ff0000, #cc0000)';
                            fileItem.querySelector('.cancel').hidden = true;
                            fileItem.querySelector('.retry').hidden = false;
                            addLog(logsContainer, `❌ ${result.error_code || 'IMPORT_FAILED'}: ${result.error_summary || '任务处理失败'}`, 'running');
                            return;

                        case 'cancelled':
                            statusBadge.className = 'status-badge status-failed';
                            statusBadge.textContent = '已取消';
                            fileItem.querySelector('.cancel').hidden = true;
                            addLog(logsContainer, '任务已取消', 'running');
                            return; // 停止轮询

                        default:
                            addLog(logsContainer, `⚠️ 未知状态: ${status}`, 'running');
                            break;
                    }

                    // 继续轮询
                    setTimeout(checkStatus, 2000);

                } catch (error) {
                    addLog(logsContainer, `⚠️ 获取状态失败: ${error.message}`, 'running');
                    console.error('状态轮询错误:', error);
                    // 失败后重试一次
                    setTimeout(checkStatus, 5000);
                }
            };

            // 开始第一次轮询
            setTimeout(checkStatus, 2000);
        }

        // 添加日志项
        function addLog(container, text, type) {
            const logItem = document.createElement('div');
            logItem.className = `log-item log-${type}`;

            // 添加时间戳
            const time = new Date().toLocaleTimeString();
            logItem.textContent = `[${time}] ${text}`;

            // 添加到日志容器
            container.appendChild(logItem);

            // 滚动到最新日志
            container.scrollTop = container.scrollHeight;
        }

        // 标准化完成日志
        function normalizeDoneLog(text) {
            if (typeof text !== 'string') text = String(text);
            return text.endsWith('已完成') ? text : `${text} 已完成`;
        }

        // 标准化进行中日志
        function normalizeRunningLog(text) {
            if (typeof text !== 'string') text = String(text);
            return text.startsWith('正在进行') ? text : `正在进行 ${text.replace('处理中', '')}...`;
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
